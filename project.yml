# xcodegen spec. `make bootstrap` generates Softphone.xcodeproj (git-ignored).
name: Softphone
options:
  bundleIdPrefix: com.callto365
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: configs/Signing.xcconfig
  Release: configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
packages:
  SoftphoneKit:
    path: packages/SoftphoneKit
targets:
  Softphone:
    type: application
    platform: iOS
    sources:
      - path: apps/ios/Softphone
        excludes: ["Info.plist"]
    dependencies:
      - package: SoftphoneKit
    info:
      path: apps/ios/Softphone/Info.plist
      properties:
        CFBundleDisplayName: CallTo
        CFBundleName: CallTo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: CallTo needs the microphone for phone calls.
        UIBackgroundModes: [voip, audio]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callto365.softphone
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
  SoftphoneTests:
    type: bundle.unit-test
    platform: iOS
    sources: [apps/ios/SoftphoneTests]
    dependencies:
      - target: Softphone
      - package: SoftphoneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callto365.softphone.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Softphone:
    build:
      targets:
        Softphone: all
        SoftphoneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [SoftphoneTests]
    archive:
      config: Release
